global
    log stdout format raw local0
    maxconn 4096

    ssl-default-bind-options ssl-min-ver TLSv1.2

defaults
    log global
    mode http
    option httplog
    option forwardfor

    timeout connect 5s
    timeout client 30s
    timeout server 30s

# Redirige todo HTTP a HTTPS (SSL requerido por el proyecto)
frontend http_front
    bind *:80
    http-request redirect scheme https code 301

frontend https_front
    bind *:443 ssl crt /usr/local/etc/haproxy/certs/server.pem

    # Reenvia headers de autenticacion tal cual (necesario para JWT)
    http-request set-header X-Forwarded-Proto https

    acl path_api      path_beg /api
    acl path_grafana  path_beg /grafana

    use_backend api_back     if path_api
    use_backend grafana_back if path_grafana

    # Todo lo demas (la pagina en si) va al Web balanceado
    default_backend web_back

backend api_back
    balance roundrobin

    # /api/documentos -> /documentos al llegar a la API
    http-request replace-path ^/api/?(.*) /\1

    option httpchk GET /health
    http-check expect status 200

    # host.docker.internal = IP del servidor donde corren las 2 replicas de la API
    server api1 10.150.0.3:3001 check
    server api2 10.150.0.3:3002 check

backend web_back
    balance roundrobin

    option httpchk GET /
    http-check expect status 200

    # host.docker.internal = IP del servidor donde corren las 2 replicas del Web
    server web1 10.150.0.3:5001 check
    server web2 10.150.0.3:5002 check

backend grafana_back
    server grafana grafana:3000 check

# Panel de estadisticas del balanceador (quien recibe trafico, caidas, etc.)
listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 5s
    stats show-legends
    stats show-node

# Expone metricas de HAProxy para que Prometheus (en el servidor privado) las jale
frontend prometheus_front
    bind *:8405
    mode http
    http-request use-service prometheus-exporter if { path /metrics }
    http-request return status 404
